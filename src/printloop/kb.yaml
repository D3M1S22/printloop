# PrintLoop deterministic knowledge base (docs/printloop/03_ARCHITECTURE.md §1 and §4.2).
#
# Rule: a parameter goes in here only if it has a `check` on the G-code (see printloop/preflight.py).
# Keys verified on BambuStudio 2.8.2 (P1S 0.4) with --export-settings; OrcaSlicer uses the same names.
#
# params.<key>:
#   bounds: static [min, max], or "filament_range" (the filament's nozzle_temperature_range_low/high)
#   step:   maximum step per iteration (the validator accepts up to 2x for operator choices)
#   check:  type of G-code check + arguments
#   alias:  virtual key resolved to several real keys (e.g. bed temperature depending on curr_bed_type)

params:
  bridge_speed:
    label: Bridge speed
    unit: mm/s
    bounds: [10, 100]
    step: 20
    check: {type: feature_speed, features: [Bridge]}
  bridge_flow:
    label: Bridge flow
    unit: "x"
    bounds: [0.7, 1.2]
    step: 0.05
    check: {type: extrusion_per_mm, features: [Bridge]}
  filament_flow_ratio:
    label: Filament flow ratio
    unit: "x"
    bounds: [0.8, 1.15]
    step: 0.04
    check: {type: extrusion_per_mm, features: [Outer wall, Inner wall]}
  nozzle_temperature:
    label: Nozzle temperature
    unit: °C
    bounds: filament_range
    step: 5
    check: {type: hotend_setpoint, layer: 1}
  nozzle_temperature_initial_layer:
    label: First layer nozzle temperature
    unit: °C
    bounds: filament_range
    step: 5
    check: {type: hotend_setpoint, layer: 0}
  bed_temperature:
    label: Bed temperature
    unit: °C
    bounds: [20, 110]
    step: 5
    alias: bed_temperature
    check: {type: bed_setpoint, layer: 1}
  retraction_length:
    label: Retraction length
    unit: mm
    bounds: [0.2, 2.0]
    step: 0.2
    # If the filament has an override (filament_retraction_length != nil), that one is changed.
    filament_override: filament_retraction_length
    check: {type: retraction}
  overhang_fan_speed:
    label: Overhang and bridge fan
    unit: "%"
    bounds: [0, 100]
    step: 20
    check: {type: fan_during, features: [Bridge, Overhang wall]}
  initial_layer_speed:
    label: First layer speed
    unit: mm/s
    bounds: [10, 100]
    step: 10
    check: {type: first_layer_speed, features: [Outer wall, Inner wall]}
  brim_width:
    label: Brim width
    unit: mm
    bounds: [0, 15]
    step: 4
    # With brim_type auto or none the width has no effect: the validator adds this change.
    companions: {brim_type: {when: [no_brim, auto_brim], set: outer_only}}
    check: {type: feature_length, features: [Brim]}
  filament_max_volumetric_speed:
    label: Max volumetric speed
    unit: mm³/s
    bounds: [2, 40]
    step: 3
    check: {type: volumetric_limit}

# For each defect: candidates in order of preference, with the allowed direction.
# `escalate` = the typical cause cannot be fixed from the preset: the system says so and hands over to a human.
defects:
  bridge_sagging:
    candidates:
      - {key: bridge_speed, direction: down}
      - {key: overhang_fan_speed, direction: up}
      - {key: bridge_flow, direction: down}
  over_extrusion:
    candidates:
      - {key: filament_flow_ratio, direction: down}
  under_extrusion:
    candidates:
      - {key: filament_flow_ratio, direction: up}
      - {key: filament_max_volumetric_speed, direction: down}
      - {key: nozzle_temperature, direction: up}
  stringing:
    candidates:
      - {key: retraction_length, direction: up}
      - {key: nozzle_temperature, direction: down}
  overhang_curling:
    candidates:
      - {key: overhang_fan_speed, direction: up}
      - {key: nozzle_temperature, direction: down}
  warping:
    candidates:
      - {key: bed_temperature, direction: up}
      - {key: brim_width, direction: up}
  first_layer:
    candidates:
      - {key: initial_layer_speed, direction: down}
      - {key: nozzle_temperature_initial_layer, direction: up}
      - {key: bed_temperature, direction: up}
  layer_shift:
    candidates: []
    escalate: "Typically a mechanical cause (belts, pulleys, collisions with the part): the printer needs a manual check."
  spaghetti:
    candidates: []
    escalate: "Usually the result of a detached or knocked-over part: check adhesion and the first layer, then reprint with photos of the initial defect."
  other:
    candidates: []
    escalate: "Defect outside the taxonomy: no automatic patch."
  none:
    candidates: []

# Maximum bed temperature per material (above it the validator rejects, even within `bounds`).
material_bed_max:
  PLA: 65
  PETG: 85
  TPU: 60
  ABS: 110
  ASA: 110
  PA: 110
  PC: 110
  PP: 100
