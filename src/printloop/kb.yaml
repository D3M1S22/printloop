# Knowledge base deterministica di PrintLoop (docs/printloop/03_ARCHITECTURE.md §1 e §4.2).
#
# Regola: un parametro entra qui solo se ha un `check` sul G-code (vedi printloop/preflight.py).
# Chiavi verificate su BambuStudio 2.8.2 (P1S 0.4) con --export-settings; OrcaSlicer usa gli stessi nomi.
#
# params.<chiave>:
#   bounds: [min, max] statici, oppure "filament_range" (nozzle_temperature_range_low/high del filamento)
#   step:   passo massimo per iterazione (il validatore accetta fino a 2x per scelte dell'operatore)
#   check:  tipo di verifica sul G-code + argomenti
#   alias:  chiave virtuale risolta su più chiavi reali (es. temperatura del piano in base a curr_bed_type)

params:
  bridge_speed:
    label: Velocità dei bridge
    unit: mm/s
    bounds: [10, 100]
    step: 20
    check: {type: feature_speed, features: [Bridge]}
  bridge_flow:
    label: Flusso dei bridge
    unit: "x"
    bounds: [0.7, 1.2]
    step: 0.05
    check: {type: extrusion_per_mm, features: [Bridge]}
  filament_flow_ratio:
    label: Flow ratio del filamento
    unit: "x"
    bounds: [0.8, 1.15]
    step: 0.04
    check: {type: extrusion_per_mm, features: [Outer wall, Inner wall]}
  nozzle_temperature:
    label: Temperatura ugello
    unit: °C
    bounds: filament_range
    step: 5
    check: {type: hotend_setpoint, layer: 1}
  nozzle_temperature_initial_layer:
    label: Temperatura ugello primo layer
    unit: °C
    bounds: filament_range
    step: 5
    check: {type: hotend_setpoint, layer: 0}
  bed_temperature:
    label: Temperatura del piano
    unit: °C
    bounds: [20, 110]
    step: 5
    alias: bed_temperature
    check: {type: bed_setpoint, layer: 1}
  retraction_length:
    label: Lunghezza di retrazione
    unit: mm
    bounds: [0.2, 2.0]
    step: 0.2
    # Se il filamento ha un override (filament_retraction_length != nil) si modifica quello.
    filament_override: filament_retraction_length
    check: {type: retraction}
  overhang_fan_speed:
    label: Ventola su overhang e bridge
    unit: "%"
    bounds: [0, 100]
    step: 20
    check: {type: fan_during, features: [Bridge, Overhang wall]}
  initial_layer_speed:
    label: Velocità primo layer
    unit: mm/s
    bounds: [10, 100]
    step: 10
    check: {type: first_layer_speed, features: [Outer wall, Inner wall]}
  brim_width:
    label: Larghezza brim
    unit: mm
    bounds: [0, 15]
    step: 4
    # Con brim_type auto o assente la larghezza non ha effetto: il validatore aggiunge questa modifica.
    companions: {brim_type: {when: [no_brim, auto_brim], set: outer_only}}
    check: {type: feature_length, features: [Brim]}
  filament_max_volumetric_speed:
    label: Flusso volumetrico massimo
    unit: mm³/s
    bounds: [2, 40]
    step: 3
    check: {type: volumetric_limit}

# Per ogni difetto: candidati in ordine di preferenza, con la direzione ammessa.
# `escalate` = la causa tipica non si corregge dal preset: il sistema lo dice e passa la mano all'umano.
defects:
  bridge_sagging:
    candidates:
      - {key: bridge_speed, direction: down}
      - {key: overhang_fan_speed, direction: up}
      - {key: bridge_flow, direction: down}
  over_extrusion:
    candidates:
      - {key: filament_flow_ratio, direction: down}
  under_extrusion:
    candidates:
      - {key: filament_flow_ratio, direction: up}
      - {key: filament_max_volumetric_speed, direction: down}
      - {key: nozzle_temperature, direction: up}
  stringing:
    candidates:
      - {key: retraction_length, direction: up}
      - {key: nozzle_temperature, direction: down}
  overhang_curling:
    candidates:
      - {key: overhang_fan_speed, direction: up}
      - {key: nozzle_temperature, direction: down}
  warping:
    candidates:
      - {key: bed_temperature, direction: up}
      - {key: brim_width, direction: up}
  first_layer:
    candidates:
      - {key: initial_layer_speed, direction: down}
      - {key: nozzle_temperature_initial_layer, direction: up}
      - {key: bed_temperature, direction: up}
  layer_shift:
    candidates: []
    escalate: "Causa tipicamente meccanica (cinghie, pulegge, collisioni con il pezzo): serve un controllo manuale della stampante."
  spaghetti:
    candidates: []
    escalate: "Di solito è la conseguenza di un distacco o di un pezzo urtato: controllare adesione e primo layer, poi ristampare con foto del difetto iniziale."
  other:
    candidates: []
    escalate: "Difetto fuori tassonomia: nessuna patch automatica."
  none:
    candidates: []

# Limite massimo del piano per materiale (oltre, il validatore rifiuta anche se dentro `bounds`).
material_bed_max:
  PLA: 65
  PETG: 85
  TPU: 60
  ABS: 110
  ASA: 110
  PA: 110
  PC: 110
  PP: 100
