# PrintLoop on the homelab: one container (API + UI + slicers). See deploy/README.md.
#   cd /opt/printloop && docker compose -f deploy/compose.yaml up -d --build
services:
  printloop:
    build:
      context: ..
    image: printloop:latest
    container_name: printloop
    restart: unless-stopped
    env_file: ../.env
    # Container paths, not the developer machine's: they win over the same keys in .env.
    environment:
      PRINTLOOP_RUNS_DIR: /data/runs
      MODE1_REPLAY_DIR: /data/replay
    ports:
      - "8788:8788"
    volumes:
      - ../runs:/data/runs
      - ../replay:/data/replay:ro
