[project]
name = "printloop"
version = "0.1.0"
description = "Photo-based 3D print defect diagnosis on AMD (Gemma 4 + vLLM-ROCm) with verified slicer preset patches"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
printloop = "printloop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/printloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
